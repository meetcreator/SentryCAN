version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      # Mount live data/artifacts so you don't need to rebuild after training
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    environment:
      - SENTRYCAN_DB=/app/data/sentrycan.db
      - ARTIFACT_DIR=/app/models/artifacts
      - TF_CPP_MIN_LOG_LEVEL=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - API_URL=http://api:8000
      - SENTRYCAN_DB=/app/data/sentrycan.db
    depends_on:
      api:
        condition: service_healthy
